[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26158-backend"
version = "0.1.0"
description = "Trustworthy single-pass drone reconstruction orchestration backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
segmentation = ["ultralytics>=8.3,<9"]
depth = ["pillow>=10,<13", "torch>=2.2,<3", "transformers>=4.45,<6"]
learned-matcher = ["torch>=2.2,<3"]

[project.scripts]
sih26158 = "sih26158.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
